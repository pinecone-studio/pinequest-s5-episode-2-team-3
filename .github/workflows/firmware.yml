# Compiles the scale firmware on every change, so it stays buildable.
name: firmware

on:
  pull_request:
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  push:
    branches: [main]
    paths: ['firmware/**', '.github/workflows/firmware.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "HX711 Arduino Library@0.7.5" "U8g2@2.36.19"
      - name: Build for ESP32-WROOM-32
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware
