; Smart base firmware: load cell + HX711 + ESP32-S3. Build: `pio run`, flash: `pio run -t upload`.
; Core logic tests run on a computer: `bun run test:firmware` (no board needed).
[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_deps =
  bogde/HX711@0.7.5
