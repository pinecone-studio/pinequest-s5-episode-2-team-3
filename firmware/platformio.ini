; Smart base firmware: load cell + HX711 + ESP32-S3. Build: `pio run`, flash: `pio run -t upload`.
; Core logic tests run on a computer: `bun run test:firmware` (no board needed).
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_deps =
  bogde/HX711@0.7.5
  adafruit/Adafruit GFX Library@1.11.11
  adafruit/Adafruit SSD1306@2.5.13

; XH-S3E-AI v1.0 board (16 MB flash, 8 MB PSRAM, serial over its USB-C port): `pio run -e xh-s3e-ai -t upload`.
[env:xh-s3e-ai]
extends = env:esp32s3
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  ${env:esp32s3.build_flags}
  -DBOARD_XH_S3E_AI
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
